<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alphabuys · jrny</title>
<meta name="description" content="Super shoes in Ireland, cheapest first: Nike Alphafly and Vaporfly, adidas Adios Pro, ASICS Metaspeed, Puma Nitro Elite, Saucony Endorphin. Pick your size, see who has it, catch the price drops.">
<meta name="color-scheme" content="light">
<link rel="preload" href="fonts/GeneralSans-Semibold.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* jrny v2 design system: docs/design.md in the jrny repo (fonts and tokens
   copied from jrny main, 21 Oct 2026). alphabuys specifics: docs/design.md here. */
@font-face { font-family: "General Sans"; src: url("fonts/GeneralSans-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "General Sans"; src: url("fonts/GeneralSans-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "General Sans"; src: url("fonts/GeneralSans-Semibold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "General Sans"; src: url("fonts/GeneralSans-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }

:root {
  --ink: #2e2e2e;          /* all text */
  --band: #242424;
  --teal: #009ead;         /* means: price facts, the chart */
  --neon: #d4ff3a;         /* means: your size (Kevin's call, 21 Oct) */
  --teal-text: #007a87;    /* small teal text (AA) */
  --teal40: #99d8de;
  --teal10: #e6f5f7;
  --page: #ffffff;
  --grey: #f4f5f5;         /* behind photos and panels */
  --fill: #e4e6e7;         /* segmented control track */
  --destructive: #b42318;
  --shadow-card: 0 0.5px 1px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.045);
  --dur-quick: 150ms; --dur-fast: 240ms; --dur-base: 320ms;
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --font: "General Sans", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  --gutter: 20px;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 400 17px/22px var(--font); font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
.col { max-width: 720px; margin: 0 auto; padding: 0 var(--gutter); }

/* Apple text styles only */
.large-title { font: 700 34px/41px var(--font); letter-spacing: -0.02em; margin: 0; }
.title3 { font: 600 20px/25px var(--font); letter-spacing: -0.01em; margin: 0; }
.headline { font: 600 17px/22px var(--font); letter-spacing: -0.01em; }
.subhead { font: 400 15px/20px var(--font); }
.footnote { font: 400 13px/18px var(--font); }
.data { font: 500 13.5px/18px var(--font); }

/* ---------- The black band ---------- */
.band { background: var(--band); color: #fff; padding: 12px 0 16px; }
.nav { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
.nav a { text-decoration: none; }
.wordmark { font: 700 17px/22px var(--font); letter-spacing: -0.01em; }
.nav .footnote a { text-decoration: underline; text-underline-offset: 2px; }
.band .large-title { margin-top: 4px; }
/* "Buys" on a neon block, as v1's logo */
.hl { background: var(--neon); color: var(--ink); padding: 0 6px; border-radius: 4px; }
.band .context { margin: 6px 0 16px; }
/* Shoe pills: the week-pill style. One line, semibold; selected is a white pill in bold. */
.pills { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter); }
.pills::-webkit-scrollbar { display: none; }
.pills button {
  flex: none; min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; cursor: pointer;
  background: transparent; color: #fff; font: 600 15px/20px var(--font); white-space: nowrap;
  transition: background var(--dur-quick) ease;
}
.pills button:hover { background: rgba(255,255,255,.08); }
.pills button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 700; }

/* ---------- Filters (on white) ---------- */
.filters { padding: 16px 0 8px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row + .row { margin-top: 12px; }
.seg { display: inline-flex; background: var(--fill); border-radius: 10px; padding: 2px; }
.seg[hidden] { display: none; }
.seg button {
  border: 0; background: transparent; border-radius: 8px; min-height: 40px; padding: 0 14px;
  font: 600 15px/20px var(--font); cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 700; }
#model { overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.sizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; padding: 2px 0 6px; }
.size {
  min-width: 44px; height: 44px; padding: 0 4px; border: 0; border-radius: 9px; cursor: pointer;
  background: var(--page); box-shadow: var(--shadow-card); font: 600 17px/22px var(--font);
}
.size.any { font-size: 15px; grid-column: span 2; }
/* Your size: solid teal, white text (like "today" in jrny). */
.size[aria-pressed="true"] { background: var(--neon); color: var(--ink); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--ink); }
.size.any[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }  /* no size picked: not neon */
.label { font: 600 15px/20px var(--font); }

/* ---------- Cheapest pair ---------- */
.best { margin: 16px 0 8px; border-radius: 16px; box-shadow: var(--shadow-card); overflow: hidden; background: var(--page); }
.best .pic { background: var(--grey); height: 200px; display: grid; place-items: center; }
.best .pic img { max-width: 80%; max-height: 180px; object-fit: contain; mix-blend-mode: multiply; }
.best .pic img.fill { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: cover; }
.best .info { padding: 16px 20px 20px; }
.best .what { margin: 2px 0 0; }
.best-sizes { font: 500 15px/20px var(--font); margin-top: 8px; }
.price-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.price-line .now { font: 700 34px/41px var(--font); letter-spacing: -0.02em; }
.was { text-decoration: line-through; font-weight: 400; }
.off { color: var(--teal-text); font: 600 15px/20px var(--font); }
.note { color: var(--teal-text); font: 600 15px/20px var(--font); margin-top: 4px; }
.buy {
  display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px;
  min-height: 48px; border-radius: 12px; background: var(--ink); color: #fff; text-decoration: none;
  font: 600 17px/22px var(--font); transition: opacity var(--dur-quick) ease;
}
.buy:hover { opacity: .88; }

/* ---------- Sections ---------- */
section { margin-top: 32px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }

/* Price chart: teal line, eased fill, draws itself in. */
.chart svg { width: 100%; height: auto; display: block; margin-top: 12px; overflow: visible; }
.chart .empty { margin-top: 8px; }

/* The list: full width on white, no dividers; spacing separates rows. */
.list { margin: 8px 0 0; padding: 0; list-style: none; }
.list a {
  display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center;
  min-height: 88px; padding: 12px 0; text-decoration: none;
}
.thumb { width: 64px; height: 64px; border-radius: 9px; background: var(--grey); overflow: hidden; display: grid; place-items: center; }
.thumb img { width: 92%; height: 92%; object-fit: contain; mix-blend-mode: multiply; }
.thumb img.fill { width: 100%; height: 100%; object-fit: cover; }
.list .mid { min-width: 0; }
.list .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .sizes-line { margin-top: 2px; }
.me { background: var(--neon); color: var(--ink); font-weight: 700; border-radius: 4px; padding: 0 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.list .right { text-align: right; }
.list .p { font: 600 17px/22px var(--font); }
.list .w { font: 400 13px/18px var(--font); text-decoration: line-through; }
.list .d { color: var(--teal-text); font: 600 13px/18px var(--font); }
.list a:hover .headline { text-decoration: underline; text-underline-offset: 3px; }
.none { padding: 24px 0; }

/* Shops */
.shops { margin: 8px 0 0; padding: 0; list-style: none; }
.shops li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 10px 0; }
.shops a { font-weight: 600; text-decoration: none; }
.shops a:hover { text-decoration: underline; }
.stale { color: var(--destructive); }
footer { margin: 32px 0 48px; }
footer p { margin: 0 0 8px; }

@media (min-width: 720px) {
  .best { display: grid; grid-template-columns: 280px 1fr; }
  .best .pic { height: auto; min-height: 240px; }
}
</style>
</head>
<body>
<header class="band">
  <div class="col">
    <div class="nav">
      <a class="wordmark" href="https://jrny.run" aria-label="jrny.run home">jrny</a>
      <span class="footnote">Super shoes · <a href="https://jrny.run">jrny.run</a></span>
    </div>
    <h1 class="large-title">alpha<span class="hl">buys</span></h1>
    <p class="context subhead" id="context">&nbsp;</p>
    <nav class="pills" id="shoes" aria-label="Shoe"></nav>
  </div>
</header>

<main class="col">
  <div class="filters">
    <div class="row">
      <div class="seg" id="gender" role="group" aria-label="Fit">
        <button data-v="men">Men's</button><button data-v="women">Women's</button>
      </div>
      <div class="seg" id="model" role="group" aria-label="Version"></div>
    </div>
    <div class="row"><span class="label">UK size</span></div>
    <div class="sizes" id="sizes" role="group" aria-label="UK size"></div>
  </div>

  <div id="best"></div>

  <section class="chart">
    <h2 class="title3">Cheapest each day</h2>
    <p class="subhead" id="chartSub"></p>
    <div id="chart"></div>
  </section>

  <section>
    <div class="section-head">
      <h2 class="title3" id="listTitle">In stock</h2>
      <span class="subhead" id="count"></span>
    </div>
    <ul class="list" id="grid"></ul>
  </section>

  <section>
    <h2 class="title3">Shops we check</h2>
    <ul class="shops" id="shops"></ul>
  </section>

  <footer class="footnote">
    <p>Prices checked four times a day. Every shop here delivers to Ireland. Always confirm the price on the shop's site.</p>
    <p>Not affiliated with any shoe brand or retailer. Made by <a href="https://jrny.run">jrny</a>.</p>
  </footer>
</main>

<script>
// [file name, shop, country, home page]
const SHOPS = [
  ["nike", "Nike", "IE", "https://www.nike.com/ie"],
  ["elverys", "Elverys", "IE", "https://www.elverys.ie"],
  ["lifestyle-sports", "Lifestyle Sports", "IE", "https://www.lifestylesports.com/ie"],
  ["sports-direct", "Sports Direct", "IE", "https://ie.sportsdirect.com"],
  ["top4running", "Top4Running", "IE", "https://top4running.ie"],
  ["zalando", "Zalando", "IE", "https://www.zalando.ie"],
  ["pro-direct", "Pro:Direct", "IE", "https://www.prodirectsport.ie"],
];
// Shoes we track; ids match "shoe" in the data files.
const SHOES = [
  { id: "all", brand: "", name: "All shoes", short: m => m },
  { id: "alphafly", brand: "Nike", name: "Alphafly", short: m => m.replace("Alphafly ", "AF") },
  { id: "adios-pro", brand: "adidas", name: "Adios Pro", short: m => m.replace("Adios Pro ", "Pro ").replace("Pro Evo", "Evo") },
  { id: "metaspeed", brand: "ASICS", name: "Metaspeed", short: m => m.replace("Metaspeed ", "") },
  { id: "vaporfly", brand: "Nike", name: "Vaporfly", short: m => m.replace("Vaporfly ", "VF") },
  { id: "puma-elite", brand: "Puma", name: "Nitro Elite", short: m => m.replace(" Nitro Elite", "") },
  { id: "saucony-endorphin", brand: "Saucony", name: "Endorphin", short: m => m.replace("Endorphin ", "") },
];
const BRAND = { alphafly: "Nike", vaporfly: "Nike", "adios-pro": "adidas", metaspeed: "ASICS", "puma-elite": "Puma", "saucony-endorphin": "Saucony" };
const shoe = () => SHOES.find(x => x.id === state.shoe) || SHOES[0];
const isShoe = o => state.shoe === "all" || (o.shoe || "alphafly") === state.shoe;
const shoeWord = (plural) => state.shoe === "all" ? (plural ? "super shoes" : "super shoe") : shoe().name + (plural ? "s" : "");
const sizeKey = x => { const m = /^(\d+)(.*)$/.exec(x); return m ? +m[1] + ({ ".5": .5, "⅓": .33, "⅔": .67 }[m[2]] || 0) : 99; };
const $ = id => document.getElementById(id);
const eur = n => "€" + (Number.isInteger(n) ? n : n.toFixed(2));
const imgClass = o => ["Nike", "Pro:Direct"].includes(o.shop) ? ' class="fill"' : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const day = t => new Date(t).toLocaleDateString("en-IE", { day: "numeric", month: "short" });
const ago = t => {
  const h = (Date.now() - new Date(t)) / 36e5;
  return h < 1 ? "under an hour ago" : h < 24 ? Math.round(h) + "h ago" : Math.round(h / 24) + "d ago";
};
const fit = () => state.gender === "men" ? "men's" : "women's";

let offers = [], history = {}, checked = {};
const state = { shoe: "all", gender: "men", size: null, model: "all" };
try { Object.assign(state, JSON.parse(localStorage.getItem("alphabuys") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("alphabuys", JSON.stringify(state)); } catch (e) {} };

async function load() {
  await Promise.all(SHOPS.map(async ([slug, name]) => {
    try {
      const l = await (await fetch(`data/latest/${slug}.json`, { cache: "no-store" })).json();
      offers.push(...l.offers);
      checked[name] = l.checked;
    } catch (e) {}
    try {
      const txt = await (await fetch(`data/history/${slug}.jsonl`, { cache: "no-store" })).text();
      for (const line of txt.split("\n")) {
        if (!line.trim()) continue;
        const r = JSON.parse(line);
        (history[r.url] ||= []).push(r);
      }
    } catch (e) {}
  }));
  for (const o of offers) {
    const h = (history[o.url] || []).sort((a, b) => a.t.localeCompare(b.t));
    o.lowest = Math.min(o.price, ...h.map(r => r.price));
    o.wasHigher = h.some(r => r.price > o.price);  // "lowest" only means something after a drop
    for (let i = h.length - 1; i >= 0; i--) {
      if (h[i].price !== o.price) {
        if (h[i].price > o.price) { o.dropFrom = h[i].price; o.dropSince = h[i + 1]?.t; }
        break;
      }
    }
    o.offPct = o.was ? Math.round((1 - o.price / o.was) * 100) : 0;
  }
  render();
}

function matches(o, withSize = true) {
  return isShoe(o)
    && o.gender === state.gender
    && (!withSize || o.sizes.length > 0)
    && (state.model === "all" || o.model === state.model)
    && (!withSize || !state.size || o.sizes.includes(state.size));
}

function renderBand() {
  // One sentence of facts.
  const inStock = offers.filter(o => o.sizes.length);
  const shops = new Set(inStock.map(o => o.shop)).size;
  const last = Object.values(checked).sort().at(-1);
  $("context").textContent = `${inStock.length} pairs of super shoes in stock at ${shops} Irish shops${last ? " · checked " + ago(last) : ""}`;
  $("shoes").innerHTML = SHOES.map(x =>
    `<button data-v="${x.id}" aria-pressed="${x.id === state.shoe}">${x.name}</button>`).join("");
  $("shoes").querySelector('[aria-pressed="true"]')?.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function renderFilters() {
  for (const b of $("gender").children) b.setAttribute("aria-pressed", b.dataset.v === state.gender);
  const models = state.shoe === "all" ? [] : [...new Set(offers.filter(o => isShoe(o) && o.sizes.length).map(o => o.model))].sort();
  $("model").hidden = models.length < 2;
  if (state.model !== "all" && !models.includes(state.model)) state.model = "all";
  $("model").innerHTML = ["all", ...models].map(m =>
    `<button data-v="${esc(m)}" aria-pressed="${m === state.model}">${m === "all" ? "All" : esc(shoe().short(m))}</button>`).join("");
  const sizes = [...new Set(offers.filter(o => isShoe(o) && o.gender === state.gender && o.sizes.length).flatMap(o => o.sizes))];
  if (state.size && !sizes.includes(state.size)) sizes.push(state.size);
  sizes.sort((a, b) => sizeKey(a) - sizeKey(b));
  $("sizes").innerHTML = [`<button class="size any" data-v="" aria-pressed="${!state.size}">Any</button>`,
    ...sizes.map(s => `<button class="size" data-v="${s}" aria-pressed="${s === state.size}">${s}</button>`)].join("");
}

function note(o) {
  if (o.dropFrom) return `Down ${eur(+(o.dropFrom - o.price).toFixed(2))}${o.dropSince ? " since " + day(o.dropSince) : ""}`;
  if (o.wasHigher && o.price <= o.lowest) return "Lowest price we've seen";
  return "";
}
const fullName = o => `${BRAND[o.shoe] || ""} ${o.model}`.trim();
// "UK 7 · 8 · 9 · 10" with your size in teal
const sizeLine = o => "UK " + o.sizes.map(s => s === state.size ? `<span class="me">${s}</span>` : s).join(" · ");

function renderBest(list) {
  const o = list[0];
  if (!o) { $("best").innerHTML = ""; return; }
  const n = note(o);
  $("best").innerHTML = `
    <article class="best">
      <div class="pic">${o.image ? `<img${imgClass(o)} src="${esc(o.image)}" alt="${esc(fullName(o))}, ${esc(o.colour)}">` : ""}</div>
      <div class="info">
        <div class="subhead">Cheapest ${fit()} ${shoeWord(false)}${state.size ? " in UK " + esc(state.size) : ""}</div>
        <div class="title3 what">${esc(fullName(o))}</div>
        <div class="subhead">${esc(o.shop)}${o.colour ? " · " + esc(cap(o.colour)) : ""}</div>
        <div class="best-sizes"><span class="label">In stock</span> ${sizeLine(o)}</div>
        <div class="price-line">
          <span class="now">${eur(o.price)}</span>
          ${o.was ? `<span class="was subhead">${eur(o.was)}</span><span class="off">${o.offPct}% off</span>` : ""}
        </div>
        ${n ? `<div class="note">${n}</div>` : ""}
        <a class="buy" href="${esc(o.url)}" target="_blank" rel="noopener">Buy at ${esc(o.shop)}</a>
      </div>
    </article>`;
}

function renderList(list) {
  $("listTitle").textContent = state.size ? `UK ${state.size} in stock` : `${cap(fit())} in stock`;
  $("count").textContent = `${list.length} ${list.length === 1 ? "pair" : "pairs"} · ${new Set(list.map(o => o.shop)).size} shops`;
  if (!list.length) {
    $("grid").innerHTML = `<li class="none subhead">No shop has this in stock right now. Prices are checked four times a day.</li>`;
    return;
  }
  $("grid").innerHTML = list.map(o => {
    const n = note(o);
    return `<li><a href="${esc(o.url)}" target="_blank" rel="noopener">
      <div class="thumb">${o.image ? `<img${imgClass(o)} loading="lazy" src="${esc(o.image)}" alt="">` : ""}</div>
      <div class="mid">
        <div class="headline">${esc(fullName(o))}</div>
        <div class="sub subhead">${esc(o.shop)}${o.colour ? " · " + esc(cap(o.colour)) : ""}</div>
        <div class="sizes-line data">${sizeLine(o)}</div>
      </div>
      <div class="right">
        <div class="p">${eur(o.price)}</div>
        ${o.was ? `<div class="w">${eur(o.was)}</div>` : ""}
        ${n ? `<div class="d">${n.startsWith("Down") ? n.split(" since")[0] : "Lowest"}</div>` : o.offPct >= 5 ? `<div class="d">${o.offPct}% off</div>` : ""}
      </div>
    </a></li>`;
  }).join("");
}

function renderChart() {
  const meta = Object.fromEntries(offers.map(o => [o.url, o]));
  const byDay = {};
  for (const [url, rows] of Object.entries(history)) {
    const o = meta[url];
    if (!o || !matches({ ...o, sizes: [] }, false)) continue;
    for (const r of rows) {
      if (state.size && !r.sizes.includes(state.size)) continue;
      if (!r.sizes.length) continue;
      const d = r.t.slice(0, 10);
      byDay[d] = Math.min(byDay[d] ?? Infinity, r.price);
    }
  }
  const pts = Object.entries(byDay).sort();
  const who = `${fit()} ${state.model === "all" ? shoeWord(false) : state.model}${state.size ? " in UK " + state.size : ""}`;
  $("chartSub").textContent = `Lowest in-stock price for a ${who}, across all ${SHOPS.length} shops.`;
  if (pts.length < 2) {
    $("chart").innerHTML = `<p class="empty subhead">${pts.length ? `Today: <b>${eur(pts[0][1])}</b>. ` : ""}The line fills in as prices are collected.</p>`;
    return;
  }
  const W = Math.round($("chart").clientWidth) || 680, H = 180, L = 52, R = 8, T = 12, B = 26;  // drawn at real width so text stays 13px
  const ys = pts.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = Math.max(5, (hi - lo) * .2), y0 = lo - pad, y1 = hi + pad;
  const x = i => L + (W - L - R) * (i / (pts.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length - 1).toFixed(1)},${H - B}L${L},${H - B}Z`;
  // Eased fill: ~15 stops on an ease-in-out curve, never a two-stop gradient.
  const stops = Array.from({ length: 16 }, (_, i) => {
    const t = i / 15, e = t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
    return `<stop offset="${(t * 100).toFixed(1)}%" stop-color="#009ead" stop-opacity="${(0.22 * (1 - e)).toFixed(3)}"/>`;
  }).join("");
  const minI = ys.indexOf(lo);
  $("chart").innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cheapest price each day, ${eur(lo)} lowest">
      <defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">${stops}</linearGradient></defs>
      <text x="${L - 10}" y="${y(hi) + 5}" text-anchor="end" font-size="13" font-weight="500" fill="#2e2e2e">${eur(Math.round(hi))}</text>
      <text x="${L - 10}" y="${y(lo) + 5}" text-anchor="end" font-size="13" font-weight="500" fill="#2e2e2e">${eur(Math.round(lo))}</text>
      <path d="${area}" fill="url(#fade)"/>
      <path class="line" d="${line}" fill="none" stroke="#009ead" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(minI)}" cy="${y(lo)}" r="5" fill="#009ead" stroke="#fff" stroke-width="2"><title>${day(pts[minI][0])}: ${eur(lo)}</title></circle>
      <text x="${L}" y="${H - 6}" font-size="13" font-weight="500" fill="#2e2e2e">${day(pts[0][0])}</text>
      <text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="13" font-weight="500" fill="#2e2e2e">${day(pts.at(-1)[0])}</text>
    </svg>`;
  // The line draws itself in. Its resting state is fully drawn, so if the
  // animation never runs the line is still all there.
  const ln = $("chart").querySelector(".line");
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches && "IntersectionObserver" in window) {
    const seen = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      seen.disconnect();
      const len = Math.ceil(ln.getTotalLength());
      ln.style.strokeDasharray = len;
      ln.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 900, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" });
      setTimeout(() => { ln.style.strokeDasharray = "none"; }, 1000);  // always ends fully drawn
    }, { threshold: 0.5 });
    seen.observe(ln.ownerSVGElement);
  }
}

function renderShops() {
  $("shops").innerHTML = SHOPS.map(([, name, , url]) => {
    const t = checked[name];
    const stale = !t || (Date.now() - new Date(t)) > 36 * 36e5;
    const n = offers.filter(o => o.shop === name && isShoe(o) && o.sizes.length).length;
    return `<li><span><a href="${url}" target="_blank" rel="noopener">${name}</a><span class="subhead"> · ${n || "none"} in stock</span></span>
      <span class="footnote${stale ? " stale" : ""}">${t ? "checked " + ago(t) : "not checked yet"}</span></li>`;
  }).join("");
}

function render() {
  renderBand();
  renderFilters();
  const list = offers.filter(o => matches(o)).sort((a, b) => a.price - b.price);
  renderBest(list);
  renderChart();
  renderList(list);
  renderShops();
}

$("shoes").addEventListener("click", e => {
  const v = e.target.closest("button")?.dataset.v; if (!v) return;
  state.shoe = v; state.model = "all"; save(); render();  // size stays: same feet
});
$("gender").addEventListener("click", e => {
  const v = e.target.closest("button")?.dataset.v; if (!v) return;
  state.gender = v; state.size = null; save(); render();
});
$("model").addEventListener("click", e => {
  const v = e.target.closest("button")?.dataset.v; if (!v) return;
  state.model = v; save(); render();
});
$("sizes").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.size = b.dataset.v || null; save(); render();
});
load();
</script>
</body>
</html>
