name: Check prices

on:
  schedule:
    # Every 3 hours, off the hour: GitHub drops scheduled runs when busy (on the hour
    # most of all), and at 6/10/14/18 only two a day were running, hours late.
    - cron: "23 */3 * * *"
  workflow_dispatch:                # "Run workflow" button for a manual check

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check shops
        # Top4Running, Lifestyle Sports and 365rider block GitHub servers; the Mac checks them (mac-check.sh)
        run: python3 check.py Nike Elverys "Sports Direct" Zalando Pro:Direct "The Run Hub" "Mister Running" SportsShoes
      - name: Save prices
        run: |
          git config user.name "alpha-buys-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Prices $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase -q && git push
